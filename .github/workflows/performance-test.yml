name: AI-Powered JMeter Performance Test

on:
  workflow_dispatch:
    inputs:
      test_file:
        description: "JMeter test file"
        required: true
        default: "tests/load_test_20.jmx"

  push:
    branches:
      - staging

jobs:
  performance-test:

#    runs-on: ubuntu-latest
    runs-on: windows-latest

    steps:

      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Install Node dependencies
      - name: Install dependencies
        run: npm install

      # 4. Install JMeter
      - name: Install JMeter
        run: |
          wget https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.tgz
          tar -xzf apache-jmeter-5.6.3.tgz
          echo "$PWD/apache-jmeter-5.6.3/bin" >> "$GITHUB_PATH"

      # 5. Verify JMeter
      - name: Verify JMeter
        run: |
          jmeter --version
          which jmeter

      # 6. Run JMeter test
      - name: Run JMeter Performance Test
        run: |
          npm run test -- "${{ github.event.inputs.test_file || 'tests/load_test_20.jmx' }}"

#      # 7. Upload JMeter results
#      - name: Upload Performance Results
#        if: always()
#        uses: actions/upload-artifact@v4
#        with:
#          name: jmeter-performance-results
#          path: |
#            results/*.jtl
#            results/*_summary.json
#            results/*_report/

      # 7. Upload all performance results
      - name: Upload Performance Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-performance-results
          path: |
            results/*.jtl
            results/*_summary.json
            results/*_report/
            results/*_ai_analysis.md